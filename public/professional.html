<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Professional Profile | Bingo Dog Wash</title>
  <meta name="description" content="Approved local pet professional profile on Bingo Dog Wash.">
  <link rel="canonical" href="https://bingodogwash.com/professional.html">
  <link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest"><link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header"><nav class="nav"><a class="brand" href="index.html"><img class="brand-logo" src="/images/bingo-dog-wash-logo.optimized.png" alt="Bingo Self-Service Dog Wash" width="132" height="132" decoding="async"></a><button class="menu-toggle" type="button">Menu</button><div class="nav-links"><a href="index.html">Home</a><a href="wash.html">Wash</a><a href="shop.html">Shop</a><a href="dog-walker-club.html">Dog Walker Club</a><a href="find-a-professional.html">Find a Professional</a><a href="gift-cards.html">Gift Cards</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="faq.html">FAQ</a><a href="account.html">Account</a><a class="basket" href="cart.html">Cart <span data-basket-count>0</span></a></div></nav></header>
  <main class="container">
    <section data-professional-profile><div class="page-title"><h1>Local pet professional</h1><p>Loading professional profile?</p></div></section>
    <section class="card" data-professional-enquiry-panel hidden>
      <span class="eyebrow">Secure enquiry</span>
      <h2>Contact this professional</h2>
      <p>Your enquiry is sent securely. Private professional contact details are not displayed publicly.</p>
      <form class="form" data-professional-enquiry>
        <div class="grid grid-2">
          <label>Your name *<input name="customerName" required></label>
          <label>Your email *<input name="customerEmail" type="email" required></label>
          <label>Your phone<input name="customerPhone" autocomplete="tel"></label>
          <label>Postcode<input name="postcode" autocomplete="postal-code"></label>
          <label>Service required<input name="serviceRequired"></label>
          <label>Preferred dates<input name="preferredDates"></label>
        </div>
        <label>Dog details<textarea name="dogDetails" rows="3"></textarea></label>
        <label>Message<textarea name="message" rows="4"></textarea></label>
        <label class="check-row"><input name="shareConsent" type="checkbox" required> I consent to Bingo Dog Wash sharing this enquiry with the selected professional.</label>
        <button class="btn btn-primary" type="submit">Send Enquiry</button>
        <p class="notice" data-professional-enquiry-message hidden></p>
      </form>
    </section>
  </main>
  <script src="site.js?v=20260715-dog-walker-club" defer></script>
</body>
</html>
